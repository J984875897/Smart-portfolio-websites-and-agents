[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cityu-portfolio-research"
version = "0.1.0"
description = "Reproducible personal portfolio research workbench"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "vectorbt==1.1.2",
    "yfinance==1.7.0",
    "openpyxl==3.1.5",
    "exchange_calendars==4.13.2",
    "korean_lunar_calendar==0.4.0",
    "pyluach==2.3.0",
    "toolz==1.2.0",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
ui = ["streamlit==1.65.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

